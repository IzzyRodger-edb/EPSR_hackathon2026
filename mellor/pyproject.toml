[project]
name = "mellor"
version = "0.1.0"
description = "Mellor: an LLM agent that sets up, runs, analyses and reports EPSR refinements of measured structure-factor data (.mint01)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "epsr-py",
    "epsrvis",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "reportlab>=4.0",
    "huggingface-hub>=0.30",
]

[project.optional-dependencies]
# Run the language model locally (GPU or CPU) with transformers.
local = [
    "torch>=2.7",
    "transformers>=4.51",
    "accelerate>=1.0",
    "safetensors>=0.4",
]

[project.scripts]
mellor = "mellor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pypdf>=4",
    "ruff>=0.6",
    "black>=24",
    "isort>=5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mellor"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
epsr-py = { path = "../python" }
epsrvis = { path = "../visualisation/python_visualisation_toolkit" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs EPSR (tens of seconds to minutes)",
    "gpu: needs the local language model (downloads it from Hugging Face)",
    "network: needs internet access",
]
addopts = "-ra"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["mellor"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM", "NPY", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["src/mellor"]
