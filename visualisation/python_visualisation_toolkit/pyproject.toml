[project]
name = "epsrvis"
version = "0.1.0"
description = "Analysis and visualisation of EPSR refinements (Rust EPSR port): per-iteration fit metrics, structure factors, partial g(r), 3D configurations"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# 3D configuration viewer (epsrvis.viewer) and GIF/MP4 output
viewer = [
    "pyvista>=0.43",
    "imageio>=2.30",
    "imageio-ffmpeg>=0.6.0",
]

[project.scripts]
epsrvis = "epsrvis.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# examples and tests use the viewer too
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
